<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marquee">
<meta name="description" content="One hub for the media stack: queues, calendar, requests, activity.">
<title>Marquee</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Marquee home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="4" y="8" width="24" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M10 4l6 4 6-4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 13v7l6-3.5z" fill="currentColor"/></svg>
      <span class="brand-name">Marquee</span>
    </a>
    <nav class="topnav" id="topnav" hidden>
      <a href="#/" data-nav="home">Home</a>
      <a href="#/queue" data-nav="queue">Queue</a>
      <a href="#/calendar" data-nav="calendar">Calendar</a>
      <a href="#/requests" data-nav="requests">Requests</a>
      <a href="#/activity" data-nav="activity">Activity</a>
      <a href="#/library" data-nav="library">Library</a>
    </nav>
    <div class="topbar-right">
      <button id="refresh-btn" class="iconbtn" aria-label="Refresh" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <a class="iconbtn" id="settings-btn" href="#/settings" data-nav="settings" aria-label="Settings" hidden><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/" data-nav="home"><span>⌂</span>Home</a>
    <a href="#/queue" data-nav="queue"><span>⇣</span>Queue</a>
    <a href="#/calendar" data-nav="calendar"><span>▦</span>Calendar</a>
    <a href="#/requests" data-nav="requests"><span>✚</span>Requests</a>
    <a href="#/activity" data-nav="activity"><span>▶</span>Activity</a>

  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/views.js"></script>
<script src="./js/app.js"></script>
